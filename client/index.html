<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TERMINAL_UPLINK_V2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Design Tokens */
            --bg-color: #0a0a0a;
            --primary-color: #33ff00; /* Neon Green */
            --secondary-color: #ffb000; /* Amber */
            --dim-color: #1f521f;
            --error-color: #ff3333;
            --font-stack: 'JetBrains Mono', 'Fira Code', monospace;
            --scanline-color: rgba(0, 0, 0, 0.5);
            --glow: 0 0 5px rgba(51, 255, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--dim-color) var(--bg-color);
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: var(--font-stack);
            overflow: hidden; /* App-like feel */
            font-size: 14px; /* Default terminal size */
            line-height: 1.5;
        }

        /* Scanlines Overlay */
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.6;
        }
        
        /* Subtle flicker animation */
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 0.99; }
            100% { opacity: 0.98; }
        }
        
        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            padding: 10px;
            animation: flicker 0.1s infinite;
        }

        /* HEADER */
        header {
            border: 1px solid var(--dim-color);
            border-bottom: none;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            font-size: 1.1em;
            font-weight: 700;
            text-shadow: var(--glow);
        }

        #clock {
            font-size: 1em;
            color: var(--secondary-color);
        }

        /* MAIN OUTPUT AREA */
        #terminal-window {
            flex: 1;
            border: 1px solid var(--dim-color);
            background: rgba(10, 10, 10, 0.95);
            padding: 10px;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 10px;
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--dim-color);
            border: 1px solid var(--bg-color);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-color);
        }

        /* MESSAGES */
        .msg-line {
            display: block;
            margin-bottom: 4px;
            word-wrap: break-word;
            opacity: 0.9;
        }
        .msg-line:hover {
            background-color: rgba(51, 255, 0, 0.05); /* Very subtle highlight */
        }

        .timestamp {
            color: var(--dim-color);
            margin-right: 8px;
        }

        .username {
            color: var(--secondary-color);
            font-weight: bold;
        }

        .separator {
            color: var(--dim-color);
            margin: 0 4px;
        }

        .system-msg {
            color: var(--dim-color);
            font-style: italic;
        }
        
        .prompt-msg {
             color: var(--secondary-color);
             font-weight: bold;
        }

        .error-msg {
            color: var(--error-color);
        }

        /* INPUT AREA */
        #command-line {
            border: 1px solid var(--dim-color);
            border-top: none;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            background: var(--bg-color);
        }

        .prompt {
            color: var(--primary-color);
            margin-right: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--primary-color);
            font-family: var(--font-stack);
            font-size: 1em;
            padding: 0;
            caret-color: var(--primary-color); /* The block cursor effect is native-ish */
        }
        
        #input::placeholder {
            color: var(--dim-color);
            opacity: 0.5;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            #app-container {
                padding: 5px;
            }
            .prompt {
                content: "$"; /* Shorten prompt on mobile if possible via CSS content replacement? actually better to just hide part of it or keep it short initially */
                display: none; /* Hide full prompt on very small screens? No, just keep it, it wraps naturally with flex */
            }
            .mobile-prompt-icon {
                 display: inline;
            }
            .desktop-prompt-text {
                display: none;
            }
        }
        @media (min-width: 601px) {
             .mobile-prompt-icon {
                 display: none;
            }
            .desktop-prompt-text {
                display: inline;
            }
        }

        /* Utilities */
        .blink {
            animation: blinker 1s linear infinite;
        }
        @keyframes blinker {
            50% { opacity: 0; }
        }
        
        .hl {
            color: #fff;
            background: var(--primary-color);
        }

    </style>
</head>
<body>

    <div id="scanlines"></div>

    <div id="app-container">
        <header>
            <h1><span class="blink">_</span>TERMINAL_UPLINK</h1>
            <div id="clock">[00:00:00]</div>
        </header>

        <div id="terminal-window" id="messages">
            <!-- Startup Sequence -->
            <div class="msg-line system-msg">Initializing connection protocol...</div>
            <div class="msg-line system-msg">Loading modules... [OK]</div>
            <div class="msg-line system-msg">Establishing secure socket layer...</div>
            <br>
        </div>

        <div id="command-line">
            <span class="prompt">
                <span class="desktop-prompt-text">user@rtcs:~$</span>
                <span class="mobile-prompt-icon">$</span>
            </span>
            <input type="text" id="input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        // --- UI LOGIC ---
        
        // Clock
        function updateClock() {
            const now = new Date();
            const pad = n => n.toString().padStart(2, '0');
            const timeStr = `[${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}]`;
            document.getElementById('clock').textContent = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Auto-scroll
        const terminalWindow = document.getElementById('terminal-window');
        function scrollToBottom() {
            terminalWindow.scrollTop = terminalWindow.scrollHeight;
        }
        
        // Keep focus on input
        const inputField = document.getElementById('input');
        // Optional: aggressively grab focus if the user clicks anywhere in the terminal
        document.addEventListener('click', (e) => {
             // Only focus if they didn't select text
             if (window.getSelection().toString().length === 0) {
                 inputField.focus();
             }
        });

        // --- WEBSOCKET LOGIC ---
        
        const ws = new WebSocket('ws://' + location.hostname + ':7742/ws');
        let usernamePromptId = null;
        let awaitingUsername = false;

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function (c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;','\'':'&#39;'}[c]||c;
            });
        }
        
        function getTimestamp() {
            const now = new Date();
             const pad = n => n.toString().padStart(2, '0');
            return `${pad(now.getHours())}:${pad(now.getMinutes())}`;
        }

        ws.onopen = () => {
            appendLog('SYSTEM', 'Connection established. Handshake complete.', 'system');
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data.Type === 'prompt') {
                    awaitingUsername = true;
                    appendLog('SERVER', data.Message, 'prompt');
                    inputField.placeholder = "Enter identity...";
                    
                } else if (data.Type === 'error') {
                    appendLog('ERROR', data.Message, 'error');
                    
                } else if (data.Type === 'success') {
                    awaitingUsername = false;
                    appendLog('SUCCESS', data.Message, 'system');
                    inputField.placeholder = ""; // Clear placeholder
                    
                } else if (data.Type === 'message') {
                    appendLog(data.UserName, data.Message, 'chat', data.Time);
                    
                } else {
                    // Fallback
                    appendLog('UNKNOWN', data.Message || JSON.stringify(data), 'system');
                }
            } catch (e) {
                // Not JSON
                appendLog('RAW', event.data, 'system');
            }
        };

        ws.onclose = () => {
            appendLog('SYSTEM', 'Connection terminated by remote host.', 'error');
        };
        
        function appendLog(user, message, type, time) {
            const line = document.createElement('div');
            line.className = 'msg-line';
            
            // Format: [TIME] <USER> MESSAGE
            const timeStr = time || getTimestamp();
            
            let contentHtml = `<span class="timestamp">[${timeStr}]</span>`;
            
            if (type === 'system') {
                 contentHtml += `<span class="system-msg"> *** ${escapeHtml(message)} ***</span>`;
            } else if (type === 'error') {
                 contentHtml += `<span class="error-msg"> [ERR] ${escapeHtml(message)}</span>`;
            } else if (type === 'prompt') {
                 contentHtml += `<span class="prompt-msg"> > ${escapeHtml(message)}</span>`;
            } else {
                // Chat or default
                const userClass = (type === 'chat') ? 'username' : 'system-msg';
                // Check if it's the current user (rudimentary check, or server doesn't send "Me"?)
                // Assuming server sends actual username
                contentHtml += `<span class="${userClass}">&lt;${escapeHtml(user)}&gt;</span> <span class="separator"></span> ${escapeHtml(message)}`;
            }
            
            line.innerHTML = contentHtml;
            terminalWindow.appendChild(line);
            scrollToBottom();
        }

        // Send Logic
        inputField.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const val = inputField.value;
                if (val.trim() !== '') {
                    ws.send(val);
                    // Echoing user input immediately? 
                    // The server usually echoes back, so we might duplicate if we print here.
                    // But for "terminal feel" it's sometimes nice to see what you typed.
                    // We'll trust the server echo loop for now to avoid duplications.
                    // BUT, if it's a username entry (awaitingUsername), we definitely want to clear.
                    
                    inputField.value = '';
                }
            }
        };
    </script>
</body>
</html>
